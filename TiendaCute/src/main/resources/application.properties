spring.application.name=TiendaCute

# Las credenciales viven en env.properties (ignorado por git).
# Copia env.properties.example a env.properties y completa tus valores.
spring.config.import=optional:file:./env.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tiendacute}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# update conserva los datos entre reinicios; create los borraba en cada arranque.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT: el secreto se define en env.properties (JWT_SECRET), mínimo 32 caracteres.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracion-minutos=120

# Usuario inicial: solo se crea si la tabla de usuarios está vacía.
app.admin.usuario=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:}

# Fuerza bruta: intentos fallidos por usuario + IP antes de bloquear.
app.login.max-intentos=5
app.login.bloqueo-minutos=15
